<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cargador Nítido</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #0b0b10; margin: 0; }
        button { padding: 15px 30px; font-size: 18px; font-weight: bold; background: #00ec42; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(0, 236, 66, 0.4); }
        button:hover { background: #00c236; transform: scale(1.05); }
    </style>
</head>
<body>

    <button onclick="iniciarEntornoNitido()">Abrir 55GMS HD</button>

    <script>
        function iniciarEntornoNitido() {
            const win = window.open('about:blank', '_blank');

            if (win) {
                const estructuraHTML = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="UTF-8">
                        <meta name="referrer" content="no-referrer">
                        <title>55GMS - Alta Definición</title>
                        <base href="https://55gms.com">
                        <style>
                            html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0b10; }
                            
                            /* PARCHE CRÍTICO: Desactivamos el suavizado borroso del navegador */
                            iframe { 
                                width: 100%; 
                                height: 100%; 
                                border: none; 
                                image-rendering: -webkit-optimize-contrast; /* Safari y Chrome antiguos */
                                image-rendering: crisp-edges;               /* Firefox */
                                image-rendering: pixelated;                 /* Chrome moderno y Edge */
                                transform: translateZ(0);                   /* Fuerza la aceleración por tarjeta gráfica */
                                -webkit-backface-visibility: hidden;
                                backface-visibility: hidden;
                            }
                        </style>
                    </head>
                    <body>
                        <iframe src="https://55gms.com" referrerpolicy="no-referrer" allow="fullscreen"></iframe>
                    </body>
                    </html>
                `;

                win.document.open();
                win.document.write(estructuraHTML);
                win.document.close();
            } else {
                alert("Por favor, permite las ventanas emergentes (pop-ups).");
            }
        }
    </script>
</body>
</html>
