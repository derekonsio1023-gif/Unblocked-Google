<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cargador CDN</title>
    <!-- Importamos la librería de evasión directamente desde el CDN de jsDelivr -->
    <script src="https://cdn.jsdelivr.net/gh/FogNetwork/ABC/index.js"></script>
</head>
<body>

    <button onclick="desplegarJuego()">Iniciar 55GMS vía CDN</button>

    <script>
        function desplegarJuego() {
            // Inicializamos el objeto ABC del CDN configurado en modo "overwrite" (sobreescritura)
            // Este modo inyecta el código en crudo nativamente en la RAM de la pestaña sin usar iframes
            var entornoOculto = new ABC({
                "type": "overwrite", 
                "url": "https://55gms.com" 
            });

            // Forzamos la ejecución nativa en about:blank
            entornoOculto.setType("overwrite");
            entornoOculto.setUrl("https://55gms.com");
            
            // Abre la pestaña limpia y ejecuta el secuestro de entorno a través del CDN
            entornoOculto.open();
        }
    </script>
</body>
</html>
