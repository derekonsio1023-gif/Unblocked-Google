<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cargador Nativo</title>
</head>
<body>

    <button onclick="cargarNativo()">Cargar en Memoria Nativa</button>

    <script>
        function cargarNativo() {
            // NOTA: Para que no se rompa, aquí se debe apuntar al código fuente de un proxy espejo
            // optimizado para CORS, o a una versión estática compatible.
            const urlObjetivo = "https://55gms.com"; 

            // Abrimos la pestaña limpia
            const win = window.open('about:blank', '_blank');

            if (win) {
                // Descargamos el código fuente en texto plano desde el navegador para romper el origen
                fetch(urlObjetivo)
                    .then(response => response.text())
                    .then(htmlCodigo => {
                        // Inyectamos y reescribimos el documento completo de la pestañaabout:blank
                        // SIN usar iFrame, ni object, ni embed.
                        win.document.open();
                        win.document.write(htmlCodigo);
                        win.document.close();
                    })
                    .catch(err => {
                        // Este error aparecerá si el servidor de 55GMS bloquea las peticiones directas por CORS
                        win.document.write("<h2>Error de restricciones CORS: El sitio de destino bloquea la clonación directa en memoria.</h2>");
                    });
            } else {
                alert("Por favor, permite las ventanas emergentes.");
            }
        }
    </script>
</body>
</html>
